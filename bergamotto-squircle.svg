<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgSquircle" x1="64" y1="40" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1B14" />
      <stop offset="100%" stop-color="#060D0A" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rindGrad" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="baseWedgeGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F6212" />
      <stop offset="100%" stop-color="#1A2E05" />
    </linearGradient>

    <linearGradient id="activeWedgeGrad" x1="256" y1="80" x2="440" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFCCB" />
      <stop offset="45%" stop-color="#BEF264" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0" y1="-40" x2="90" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="activeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#84CC16" flood-opacity="0.45" />
    </filter>
  </defs>

