  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="url(#rindGrad)" stroke-opacity="0.28" stroke-width="4" />
  <!-- Ambient radial glow behind the fruit -->
  <circle cx="281" cy="245" r="190" fill="url(#ambientGlow)" />
