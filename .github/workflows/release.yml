name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.0.1-alpha)'
        required: false
        default: 'v0.0.1-alpha'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libx11-dev \
            libdbus-1-dev \
            xvfb

      - name: Setup Rust toolchain (macOS Universal targets)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Rust toolchain (Windows target)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust toolchain (Linux default)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Build macOS Universal Bundle & Sign
        if: matrix.platform == 'macos'
        run: |
          npx tauri build --target universal-apple-darwin
          mkdir -p dist-release
          # Ad-hoc code signing for macOS application bundle
          find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 1 -exec codesign --force --deep --sign - {} + || true
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name "*.dmg" -exec cp {} dist-release/ \; 2>/dev/null || true
          # Package .app bundle as tar.gz
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          if [ -d "Bergamotto.app" ]; then
            tar -czf "$GITHUB_WORKSPACE/dist-release/Bergamotto_universal.app.tar.gz" Bergamotto.app
          fi

      - name: Build Windows Installers (NSIS & MSI)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          npx tauri build --bundles nsis,msi
          mkdir -p dist-release
          find src-tauri/target/release/bundle/nsis -type f -name "*.exe" -exec cp {} dist-release/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/msi -type f -name "*.msi" -exec cp {} dist-release/ \; 2>/dev/null || true

      - name: Build Linux Bundles (.deb & .AppImage)
        if: matrix.platform == 'linux'
        run: |
          npx tauri build --bundles deb,appimage
          mkdir -p dist-release
          find src-tauri/target/release/bundle/deb -type f -name "*.deb" -exec cp {} dist-release/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage" -exec cp {} dist-release/ \; 2>/dev/null || true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles-${{ matrix.platform }}
          path: dist-release/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release version and prerelease status
        id: release_info
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if echo "$TAG" | grep -Eq '-(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release tag detected: $TAG"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Production release tag detected: $TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Bergamotto ${{ steps.release_info.outputs.tag }}
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
