name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.0.1-alpha)'
        required: false
        default: 'v0.0.1-alpha'
      platform:
        description: 'Platform to build (all, windows, linux, macos)'
        required: false
        default: 'all'
      publish:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libx11-dev \
            libdbus-1-dev \
            xvfb

      - name: Setup Rust toolchain (macOS Universal targets)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Rust toolchain (Windows target)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust toolchain (Linux default)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Build macOS Universal Bundle & Sign
        if: matrix.platform == 'macos'
        run: |
          npx tauri build --target universal-apple-darwin
          mkdir -p dist-release
          for search_dir in target src-tauri/target; do
            if [ -d "$search_dir" ]; then
              find "$search_dir" -name "*.app" -path "*/bundle/macos/*" -maxdepth 6 -exec codesign --force --deep --sign - {} + 2>/dev/null || true
              find "$search_dir" -type f -name "*.dmg" -path "*/bundle/dmg/*" -exec cp {} dist-release/ \; 2>/dev/null || true
              for app_path in $(find "$search_dir" -name "Bergamotto.app" -path "*/bundle/macos/*" -type d 2>/dev/null); do
                tar -czf "$GITHUB_WORKSPACE/dist-release/Bergamotto_universal.app.tar.gz" -C "$(dirname "$app_path")" Bergamotto.app
                break
              done
            fi
          done
          echo "macOS release artifacts:"
          ls -la dist-release/

      - name: Build Windows Installers (NSIS & MSI)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          npx tauri build --bundles nsis,msi
          mkdir -p dist-release
          for search_dir in target src-tauri/target; do
            if [ -d "$search_dir" ]; then
              find "$search_dir" -type f -name "*.exe" -path "*/bundle/nsis/*" -exec cp {} dist-release/ \; 2>/dev/null || true
              find "$search_dir" -type f -name "*.msi" -path "*/bundle/msi/*" -exec cp {} dist-release/ \; 2>/dev/null || true
            fi
          done
          echo "Windows release artifacts:"
          ls -la dist-release/

      - name: Build Linux Bundles (.deb & .AppImage)
        if: matrix.platform == 'linux'
        run: |
          npx tauri build --bundles deb,appimage
          mkdir -p dist-release
          for search_dir in target src-tauri/target; do
            if [ -d "$search_dir" ]; then
              find "$search_dir" -type f -name "*.deb" -path "*/bundle/deb/*" -exec cp {} dist-release/ \; 2>/dev/null || true
              find "$search_dir" -type f -name "*.AppImage" -path "*/bundle/appimage/*" -exec cp {} dist-release/ \; 2>/dev/null || true
            fi
          done
          echo "Linux release artifacts:"
          ls -la dist-release/

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-24.04
    if: (inputs.publish == true || inputs.publish == '' || github.event_name == 'push') && !cancelled()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release version and prerelease status
        id: release_info
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if echo "$TAG" | grep -Eq '-(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release tag detected: $TAG"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Production release tag detected: $TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Bergamotto ${{ steps.release_info.outputs.tag }}
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
