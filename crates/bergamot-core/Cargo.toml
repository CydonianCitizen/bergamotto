[package]
name = "bergamot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
command-group = { version = "5.0.1", features = ["with-tokio"] }
directories = "6"
jsonschema = { version = "0.33", default-features = false }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
lzma-rs = "0.3"
sha2 = "0.10"
tar = "0.4"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25.0", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["compress"] }
